# FILE: .github/workflows/ci.yml
# PURPOSE: Runs the repository's canonical Python verifier across the supported OS/runtime
# matrix. Verification logic remains in scripts/run_ci.py; this workflow owns only checkout,
# interpreter setup, dependency installation, permissions, and cancellation policy.
# ROLE IN CODEBASE: GitHub pull requests and pushes invoke scripts/run_ci.py using the
# development dependencies declared by pyproject.toml.
# WHAT NOT TO DO: Do not duplicate individual lint/build commands, publish packages, expose
# secrets, or call live Vidbyte services from this workflow.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.11"
          - os: macos-latest
            python: "3.11"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run canonical verification
        run: python scripts/run_ci.py
