name: Bug report
description: Something in vidbyte-cli doesn't work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: vidbyte-cli version
      description: Output of `vidbyte-cli --version`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Python version
      placeholder: e.g. Windows 11, Python 3.11
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      description: Remove API keys and other secrets first.
      render: shell
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
      description: Include the error output. Re-running with `--debug` adds redacted stack frames.
    validations:
      required: true
