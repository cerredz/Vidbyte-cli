[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vidbyte-cli"
version = "0.1.0"
description = "Vidbyte CLI: authentication, research threads, and configuration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "click>=8.1,<9",
    "httpx>=0.27,<1",
    "keyring>=25.2,<26",
    "platformdirs>=4.4,<5",
    "pydantic>=2.6,<3",
    "x402[evm]==2.8.0",
    # The published 0.1.0 predates the required Codex facade; use its verified source revision.
    "vidbyte-sdk[codex] @ git+https://github.com/cerredz/Vidbyte-SDK.git@6f9f84a257036e65bab9595d3c34e8a98cdcd96e",
]

[project.optional-dependencies]
dev = [
    "build==1.5.0",
    "mypy==2.3.0",
    "ruff==0.16.0",
    "twine==6.2.0",
]

[project.urls]
Repository = "https://github.com/cerredz/Vidbyte-cli"
Issues = "https://github.com/cerredz/Vidbyte-cli/issues"

[project.scripts]
# The console entry point. Named `vidbyte-cli` (not `vidbyte`) to avoid the npm/bin
# collision with the vidbyte-skills package — see README follow-ups.
vidbyte-cli = "vidbyte_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vidbyte_cli.lib.runtime_primitives" = ["*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.11"
strict = true
follow_untyped_imports = true
packages = ["vidbyte_cli"]
