[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidbyte-cli"
version = "0.1.0"
description = "Universal Vidbyte CLI: authentication, harness runs, and configuration"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "mypy>=1.10", "pytest>=8.0"]

[project.scripts]
# The console entry point. Named `vidbyte-cli` (not `vidbyte`) to avoid the npm/bin
# collision with the vidbyte-skills package — see README follow-ups.
vidbyte-cli = "vidbyte_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["vidbyte_cli"]
